name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  copilot-review:
    # KT fork: upstream-only automation (secrets/bots of Augani/openreel-video).
    if: github.repository == 'Augani/openreel-video'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copilot Code Review
        uses: github/copilot-code-review-action@v1
