appId: com.katay.kttadtor.desktop
productName: KT Tadtor
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. OpenReel-1.2.3-arm64.dmg, OpenReel-1.2.3-x64.exe).
artifactName: KT-Tadtor-${version}-${arch}.${ext}
asar: true
afterPack: scripts/kt-adhoc-sign.cjs
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
  - dist/cli/**
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# R2-backed download subdomain and generate latest*.yml + blockmaps; the release
# CI uploads everything to R2 (the generic provider does not upload itself).
# KT: updates come from this fork's GitHub Releases, never from upstream's feed
# (otherwise installed KT builds would "update" themselves into OpenReel).
publish:
  provider: github
  owner: loestawee
  repo: KT_Tradtor
  releaseType: release
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Sign downloadable (non-App-Store) builds with the Developer ID Application
  # cert present in this team's keychain. `pnpm pack` (--dir) skips signing.
  # electron-builder adds the "Developer ID Application:" prefix itself — supply
  # only the common name (name + Team ID) or it errors on the duplicate prefix.
  # KT: no Developer ID yet → unsigned (ad-hoc) build. Set CSC_NAME / CSC_LINK to sign.
  identity: null
  # Notarization runs on `pnpm dist`. teamId is set here; credentials come from
  # env at build time: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD (or APPLE_API_KEY +
  # APPLE_API_KEY_ID + APPLE_API_ISSUER). See apps/desktop/DISTRIBUTION.md.
  notarize: false
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
linux:
  # electron-builder 26 rejects the scoped package name as a Linux binary name.
  executableName: kt-tadtor
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
