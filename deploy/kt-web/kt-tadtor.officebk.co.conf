# KT ตัดต่อ — static web build (apps/web/dist) from github.com/loestawee/KT_Tradtor
# Releases: /opt/kt-tadtor/releases/<ts>, live = /opt/kt-tadtor/current (symlink)
# Rollback: sudo ln -sfn /opt/kt-tadtor/releases/<older> /opt/kt-tadtor/current

# Requests on :80 that Cloudflare already received over HTTPS are served
# directly (no redirect loop under CF "Flexible"); anything else goes to https.
geo $realip_remote_addr $kt_tadtor_cf_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$kt_tadtor_cf_peer:$http_x_forwarded_proto" $kt_tadtor_redirect_https {
    default 1;
    "1:https" 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name kt-tadtor.officebk.co;
    # Plain HTTP that did not come through Cloudflare-over-HTTPS is upgraded.
    if ($kt_tadtor_redirect_https) { return 308 https://kt-tadtor.officebk.co$request_uri; }
    include /etc/nginx/kt-tadtor-locations.inc;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kt-tadtor.officebk.co;
    ssl_certificate /etc/letsencrypt/live/kt-tadtor.officebk.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kt-tadtor.officebk.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/kt-tadtor-locations.inc;
}
